name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # main ブランチに push されたときに起動
  workflow_dispatch: # 手動実行も可能に

# GitHub Pages への直接デプロイに必要な権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 二重実行時のバッティングを防ぎ、最新のコミットのビルドを優先する
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ビルド時に GitHub Secrets からクライアントIDを環境変数として注入します
      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      # ビルド成果物 (dist) を一時的な Pages アーティファクトとしてアップロード
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # アップロードしたアーティファクトを GitHub Pages に直接デプロイ
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
